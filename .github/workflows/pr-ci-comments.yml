name: PR CI comments

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows: ["PR CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: pr-ci-comments-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event_name == 'pull_request_target' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      # Never check out the PR head, use its artifacts, or execute its code here.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const report = require('./.github/scripts/pr-ci-comments.cjs');
            await report({ github, context, core });
