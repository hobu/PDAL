name: Docker CI
permissions:
  contents: read
concurrency:
  group: docker-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Docker ${{ matrix.runner }}
    if: github.event_name != 'push' || github.repository == 'hobu/PDAL'
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04
        - ubuntu-24.04-arm
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Simulated platform build
      run: 'echo "Branch scheduling fixture: simulated build passed"'
'on':
  push:
    branches:
    - '**'
    - '!master'
    - '!dependabot/**'
    paths-ignore:
    - doc/**
  workflow_call: null
