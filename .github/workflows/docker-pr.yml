name: Docker PR

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Docker ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build PR image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/docker/ubuntu/Dockerfile
          platforms: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'linux/arm64' || 'linux/amd64' }}
          push: false
          # The Dockerfile clones PDAL: explicitly select the contributor's commit.
          build-args: |
            GITHUB_SHA=${{ github.event.pull_request.head.sha }}
            GITHUB_REPOSITORY=${{ github.event.pull_request.head.repo.full_name }}
