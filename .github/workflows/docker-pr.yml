name: Docker CI

on:
  push:
    branches: ['**', '!master', '!dependabot/**']
    paths-ignore:
      - 'doc/**'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docker ${{ matrix.runner }}
    if: github.event_name != 'push' || github.repository == 'PDAL/PDAL'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/docker/ubuntu/Dockerfile
          platforms: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'linux/arm64' || 'linux/amd64' }}
          push: false
          # The Dockerfile clones PDAL: explicitly select the commit being tested.
          build-args: |
            GITHUB_SHA=${{ github.event.pull_request.head.sha || github.sha }}
            GITHUB_REPOSITORY=${{ github.event.pull_request.head.repo.full_name || github.repository }}
