name: Conda
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  build:
    name: Conda ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        platform:
        - windows-latest
        - macos-latest
        - ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - name: Controlled success fixture (not a PDAL build)
      run: echo "CI control-flow fixture succeeded"
