name: Conda
permissions:
  contents: read
concurrency:
  group: conda-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Conda ${{ matrix.platform }}
    runs-on: ubuntu-24.04-arm
    if: "(github.event_name != 'push' || github.repository == 'hobu/PDAL' ||\n github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) &&\n!contains(github.event.head_commit.message,\
      \ '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: true
      matrix:
        platform:
        - windows-latest
        - macos-latest
        - ubuntu-latest
    steps:
    - name: Simulated platform build
      run: 'echo "Branch scheduling fixture: simulated build passed"'
'on':
  push:
    paths-ignore:
    - doc/**
    branches-ignore:
    - dependabot/**
    tags:
    - '**'
  workflow_call: null
