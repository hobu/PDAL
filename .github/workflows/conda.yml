name: Conda
permissions:
  contents: read
jobs:
  build:
    name: Conda ${{ matrix.platform }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: true
      matrix:
        platform:
        - windows-latest
        - macos-latest
        - ubuntu-latest
    steps:
    - name: Controlled fixture (not a PDAL build)
      run: echo "Controlled CI fixture success"
'on':
  workflow_call: null
