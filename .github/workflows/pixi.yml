name: Pixi

on:
    push:
        paths-ignore:
            - 'doc/**'
        branches: [master]
        tags: ["**"]
    workflow_call:

permissions:
  contents: read

concurrency:
  group: pixi-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pixi
    defaults:
      run:
        shell: bash -l {0}
    runs-on: 'ubuntu-24.04-arm'
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: prefix-dev/setup-pixi@v0.11.2
      with:
        environments: >-
          dev

    - name: Build
      run: |
          pixi run -e dev build

    - name: Test
      run: |
          pixi run -e dev test

