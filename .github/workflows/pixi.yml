name: Pixi

on:
    push:
        paths-ignore:
            - 'doc/**'
        branches-ignore: ["dependabot/**"]
        tags: ["**"]
    workflow_call:

permissions:
  contents: read

concurrency:
  group: pixi-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pixi
    defaults:
      run:
        shell: bash -l {0}
    runs-on: 'ubuntu-24.04-arm'
    # Build upstream branches automatically; fork branches use gated PR CI.
    if: >-
      (github.event_name != 'push' || github.repository == 'PDAL/PDAL' ||
       github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: prefix-dev/setup-pixi@v0.11.2
      with:
        environments: >-
          dev

    - name: Build and test
      # The test task already depends on build and configure.
      run: |
          pixi run -e dev test
