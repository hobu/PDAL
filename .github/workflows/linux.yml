name: Linux
permissions:
  contents: read
jobs:
  build:
    name: Linux ${{ matrix.type }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        type:
        - current
        - fixed
    steps:
    - name: Controlled fixture (not a PDAL build)
      run: 'if [ "$ATTEMPT" = "1" ]; then exit 1; fi

        echo "Controlled retry success"'
      env:
        ATTEMPT: ${{ github.run_attempt }}
'on':
  workflow_call: null
