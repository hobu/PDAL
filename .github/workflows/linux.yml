name: Linux
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  build:
    name: Linux ${{ matrix.type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        type:
        - current
        - fixed
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - name: Controlled success fixture (not a PDAL build)
      run: echo "CI control-flow fixture succeeded"
