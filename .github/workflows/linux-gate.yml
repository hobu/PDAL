name: Linux ARM64 gate
permissions:
  contents: read
concurrency:
  group: linux-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Linux ARM64 current
    if: github.event_name != 'push' || github.repository == 'PDAL/PDAL' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Simulated platform build
      run: 'echo "Branch scheduling fixture: simulated build passed"'
'on':
  push:
    branches:
    - '**'
    - '!dependabot/**'
    paths-ignore:
    - doc/**
  workflow_call: null
