name: Linux ARM64 gate

on:
  # Prime the default-branch cache so new PRs can reuse compiled objects.
  push:
    branches: [master]
    paths-ignore:
      - 'doc/**'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux ARM64 current
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      BUILD_TYPE: current
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test CI reporting
        run: node --test .github/scripts/pr-ci-comments.test.cjs

      - name: Get environment cache date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: mamba-org/setup-micromamba@v3
        with:
          init-shell: bash
          environment-file: scripts/ci/current-environment.yml
          environment-name: pdal-build
          # Refresh the unlocked current packages daily instead of indefinitely
          # reusing the first environment solved for this YAML file.
          cache-environment-key: gate-current-${{ steps.date.outputs.date }}
          cache-downloads: true

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-arm64-current

      - name: Setup
        run: source ./scripts/ci/linux/setup.sh

      - name: Configure Debug build with ccache
        run: source ../scripts/ci/linux/cmake.sh
        working-directory: ./build

      - name: Build once
        run: ninja
        working-directory: ./build

      - name: Test
        # Invoke CTest directly: do not run another configure/build task.
        run: ctest --output-on-failure
        working-directory: ./build
